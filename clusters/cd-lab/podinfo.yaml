apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/podinfo
  prune: true
  wait: true
  timeout: 5m
  sourceRef: { kind: GitRepository, name: flux-system }
  dependsOn: [{ name: flagger }]
---
# the HelmRelease for Flagger lives in this directory; this Kustomization only exists so podinfo can depend on it
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/cd-lab/flagger
  prune: true
  wait: true
  timeout: 5m
  sourceRef: { kind: GitRepository, name: flux-system }
