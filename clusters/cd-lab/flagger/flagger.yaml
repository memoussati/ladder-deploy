apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 1h
  url: https://flagger.app
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flagger
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: flagger-system
  install: { createNamespace: true }
  chart:
    spec:
      chart: flagger
      version: 1.45.0
      sourceRef: { kind: HelmRepository, name: flagger }
  values:
    meshProvider: nginx
    metricsServer: http://kps-prometheus.monitoring.svc:9090
    resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 256Mi } }
