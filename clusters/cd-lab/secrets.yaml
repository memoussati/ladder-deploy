# Decrypts secrets/*.enc.yaml (exercise 08) with the age key in Secret sops-age and applies them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 5m
  path: ./secrets
  prune: true
  sourceRef: { kind: GitRepository, name: flux-system }
  decryption:
    provider: sops
    secretRef: { name: sops-age }
