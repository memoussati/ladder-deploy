# An in-cluster webhook sink that logs every request, and Flux alerts delivered to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: flux-system
  labels: { app: webhook-sink }
spec:
  replicas: 1
  selector:
    matchLabels: { app: webhook-sink }
  template:
    metadata:
      labels: { app: webhook-sink }
    spec:
      containers:
        - name: echo
          image: docker.io/mendhak/http-https-echo:37
          env: [{ name: HTTP_PORT, value: "8080" }]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: flux-system
spec:
  selector: { app: webhook-sink }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: sink
  namespace: flux-system
spec:
  type: generic
  address: http://webhook-sink.flux-system.svc/flux
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: all-info
  namespace: flux-system
spec:
  providerRef: { name: sink }
  eventSeverity: info
  eventSources:
    - { kind: GitRepository, name: "*" }
    - { kind: Kustomization, name: "*" }
    - { kind: HelmRelease, name: "*" }
    - { kind: ImageUpdateAutomation, name: "*" }
