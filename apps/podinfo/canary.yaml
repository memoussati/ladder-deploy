# Flagger: every change to the podinfo Deployment becomes a canary on the nginx ingress,
# promoted only if the request success rate stays >= 99% while the loadtester hammers it.
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: podinfo
spec:
  provider: nginx
  targetRef: { apiVersion: apps/v1, kind: Deployment, name: podinfo }
  ingressRef: { apiVersion: networking.k8s.io/v1, kind: Ingress, name: podinfo }
  progressDeadlineSeconds: 300
  service:
    port: 9898
    targetPort: 9898
  analysis:
    interval: 30s
    threshold: 2
    maxWeight: 50
    stepWeight: 25
    metrics:
      - name: success-rate
        templateRef: { name: canary-success-rate }
        thresholdRange: { min: 99 }
        interval: 1m
    webhooks:
      - name: load-test
        type: rollout
        url: http://flagger-loadtester.flux-demo/
        timeout: 5s
        metadata:
          cmd: "hey -z 1m -q 10 -c 2 -host podinfo.ladder.local http://ingress-nginx-controller.ingress-nginx/"
