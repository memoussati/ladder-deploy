apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ladder-prod
resources:
  - ../../base
replicas:
  - name: ladder-app
    count: 2
patches:
  - target: { kind: Job, name: db-migrate }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
images:
  - name: ghcr.io/memoussati/ladder-app
    newTag: 0.1.0
