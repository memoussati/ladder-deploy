# Progressive delivery for prod: the Deployment stays the pod template (workloadRef), the Rollout
# owns the ReplicaSets and shifts ingress-nginx canary weight while an analysis watches 5xx ratios.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: ladder-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ladder-app
    scaleDown: onsuccess
  selector:
    matchLabels: { app: ladder-app }
  strategy:
    canary:
      stableService: ladder-app
      canaryService: ladder-app-canary
      trafficRouting:
        nginx:
          stableIngress: ladder-app
      analysis:
        templates: [{ templateName: success-rate }]
        startingStep: 1
        args:
          - name: ingress
            value: ladder-app-ladder-app-canary
      steps:
        - setWeight: 20
        - pause: { duration: 90s }
        - setWeight: 50
        - pause: { duration: 60s }
