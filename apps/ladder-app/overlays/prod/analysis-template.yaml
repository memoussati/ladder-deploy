# 5xx ratio of the canary's traffic must stay under 5%; two failed measurements abort the rollout.
# ingress-nginx merges the canary Ingress into the primary server: metrics keep ingress="<stable>"
# and mark canary traffic with canary="<namespace>-<canary service>-<port name>".
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    - name: canary
  metrics:
    - name: error-ratio
      interval: 15s
      failureLimit: 2
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            (sum(rate(nginx_ingress_controller_requests{canary="{{args.canary}}",status=~"5.."}[1m])) or vector(0))
            /
            (sum(rate(nginx_ingress_controller_requests{canary="{{args.canary}}"}[1m])) or vector(1))
