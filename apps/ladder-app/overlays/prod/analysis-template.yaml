# 5xx ratio on the canary ingress must stay under 5%; two failed measurements abort the rollout.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate
spec:
  args:
    - name: ingress
  metrics:
    - name: error-ratio
      interval: 15s
      failureLimit: 2
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://kps-prometheus.monitoring.svc:9090
          query: |
            (sum(rate(nginx_ingress_controller_requests{ingress="{{args.ingress}}",status=~"5.."}[1m])) or vector(0))
            /
            (sum(rate(nginx_ingress_controller_requests{ingress="{{args.ingress}}"}[1m])) or vector(1))
