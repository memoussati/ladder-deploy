apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ladder-dev
resources:
- ../../base
patches:
- patch: |
    - op: replace
      path: /spec/rules/0/host
      value: ladder-app.dev.ladder.local
  target:
    kind: Ingress
    name: ladder-app
- patch: |
    - op: replace
      path: /spec/template/spec/containers/0/env/0/value
      value: dev
  target:
    kind: Job
    name: db-migrate
images:
- name: ghcr.io/memoussati/ladder-app
  newName: ghcr.io/memoussati/ladder-app
  newTag: sha-2c4daf2
