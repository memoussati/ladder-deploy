apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ladder-app
spec:
  ingressClassName: nginx
  rules:
    - host: ladder-app.ladder.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ladder-app, port: { name: http } } }
